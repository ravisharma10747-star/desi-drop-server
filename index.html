<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>DESI DROP — Battle Royale</title>
<style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#10150e;font-family:Arial,sans-serif;touch-action:none}
#game{width:100%;height:100%;display:block}
#hud{position:fixed;inset:0;pointer-events:none;color:#fff;font-weight:900;text-shadow:0 2px 3px #000;z-index:5}
.top{position:absolute;top:10px;left:10px;right:10px;display:flex;justify-content:space-between}
.card{background:#0008;border-radius:10px;padding:8px 11px}
#cross{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);font-size:25px}
#zone{position:absolute;left:10px;top:58px;background:#0008;padding:7px 10px;border-radius:9px;font-size:12px}
#name{position:absolute;left:50%;bottom:17%;transform:translateX(-50%);font-size:12px}
.controls{position:fixed;inset:0;z-index:8;pointer-events:none}
#joy{position:absolute;left:20px;bottom:25px;width:125px;height:125px;border-radius:50%;border:2px solid #fff5;background:#0004;pointer-events:auto}
#stick{position:absolute;left:34px;top:34px;width:54px;height:54px;border-radius:50%;background:#fff8}
.ctrl{position:absolute;pointer-events:auto;color:#fff;font-weight:900;border:2px solid #fff5;text-align:center;display:flex;align-items:center;justify-content:center}
#fire{right:24px;bottom:38px;width:95px;height:95px;border-radius:50%;background:#c32d28aa}
#aim{right:136px;bottom:46px;width:68px;height:68px;border-radius:50%;background:#333a;font-size:11px}
#med{right:130px;bottom:125px;width:60px;height:60px;border-radius:50%;background:#219653aa;font-size:11px}
#reload{right:25px;bottom:145px;width:95px;height:45px;border-radius:12px;background:#333a;font-size:12px}
.screen{position:fixed;inset:0;z-index:20;background:linear-gradient(#11190fef,#050805f8);display:flex;align-items:center;justify-content:center;flex-direction:column;color:#fff;text-align:center}
.screen h1{font-size:49px;letter-spacing:4px;margin:0}.screen h2{margin:6px 0;color:#d9e7d2}.screen p{max-width:320px;color:#c9d7c3}
input{width:230px;padding:14px;border:0;border-radius:12px;text-align:center;font-size:16px;margin:8px}
button{border:0;border-radius:13px;padding:15px 26px;background:#20b45a;color:#fff;font-weight:900;font-size:17px;box-shadow:0 4px 0 #087638}
.hidden{display:none!important}
#status{font-size:12px;color:#b9e6c0;margin-top:12px}
@media(min-width:800px){#joy{left:30px}#fire{right:35px}}
</style>
</head>
<body>
<canvas id="game"></canvas>

<div id="hud">
  <div class="top">
    <div class="card">❤️ <span id="hp">100</span> &nbsp; 🔫 <span id="ammo">30</span></div>
    <div class="card">☠️ <span id="kills">0</span> &nbsp; 👥 <span id="alive">0</span></div>
  </div>
  <div id="zone">ZONE: 900m</div>
  <div id="cross">+</div>
  <div id="name"></div>
</div>

<div class="controls">
  <div id="joy"><div id="stick"></div></div>
  <div id="fire" class="ctrl">FIRE</div>
  <div id="aim" class="ctrl">AIM</div>
  <div id="med" class="ctrl">MED</div>
  <div id="reload" class="ctrl">RELOAD</div>
</div>

<div id="start" class="screen">
  <h1>DESI DROP</h1>
  <h2>OLD-SCHOOL BATTLE ROYALE</h2>
  <p>Third-person Indian village map • loot • weapons • shrinking zone • online multiplayer</p>
  <input id="playerName" maxlength="16" placeholder="Player name">
  <button id="join">JOIN BATTLE</button>
  <div id="status">Connecting...</div>
</div>

<div id="end" class="screen hidden">
  <h1 id="result">GAME OVER</h1>
  <h2 id="resultText"></h2>
  <button onclick="location.reload()">PLAY AGAIN</button>
</div>

<script src="https://cdn.socket.io/4.8.1/socket.io.min.js"></script>
<script type="module">
import * as THREE from "https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.module.js";

const SERVER_URL="YOUR_RENDER_SERVER_URL";

const canvas=document.getElementById("game");
const scene=new THREE.Scene();
scene.background=new THREE.Color(0x91b66a);
scene.fog=new THREE.Fog(0x91b66a,55,430);

const camera=new THREE.PerspectiveCamera(62,innerWidth/innerHeight,.1,900);
const renderer=new THREE.WebGLRenderer({canvas,antialias:true});
renderer.setPixelRatio(Math.min(devicePixelRatio,2));
renderer.setSize(innerWidth,innerHeight);

scene.add(new THREE.HemisphereLight(0xcfe8ff,0x496238,2.2));
const sun=new THREE.DirectionalLight(0xffffff,2.2);sun.position.set(120,200,80);scene.add(sun);

const world={w:1200,d:900};
const players=new Map();
const meshes=new Map();
let socket=null,myId=null,joined=false,last=performance.now();
let me={x:0,z:0,y:0,hp:100,ammo:30,kills:0,med:2,ax:0,az:-1};
let state={players:{},bullets:[],loot:[],safe:{x:0,z:0,r:450}};
let joy={x:0,y:0},joyOn=false,shoot=false,aiming=false;
let aimDir={x:0,z:-1},keys={};

function mat(c){return new THREE.MeshStandardMaterial({color:c,roughness:.9})}
function box(w,h,d,c){const m=new THREE.Mesh(new THREE.BoxGeometry(w,h,d),mat(c));return m}
function cyl(r,h,c){const m=new THREE.Mesh(new THREE.CylinderGeometry(r,r,h,10),mat(c));return m}

const ground=box(world.w,.5,world.d,0x79a955);ground.position.y=-.25;scene.add(ground);

const road=box(world.w+.2,.06,130,0xb8a36c);road.position.y=.03;scene.add(road);
const road2=box(130,.07,world.d+.2,0xc7b27b);road2.position.y=.035;scene.add(road2);

for(let x=-500;x<600;x+=75){
  const mark=box(28,.08,4,0xe8d7a0);mark.position.set(x,.08,0);scene.add(mark);
}
for(let z=-350;z<400;z+=75){
  const mark=box(4,.08,28,0xf0dfaa);mark.position.set(0,.08,z);scene.add(mark);
}

function addHouse(x,z){
  const b=box(46,30,38,0xe3c99c);b.position.set(x,15,z);scene.add(b);
  const roof=box(52,3,44,0x8e3e30);roof.position.set(x,31,z);roof.rotation.y=.02;scene.add(roof);
  const door=box(8,15,1.5,0x5b3a26);door.position.set(x,7.5,z-19.2);scene.add(door);
}
for(let i=0;i<25;i++){
  const x=((i*173)%1000)-500,z=((i*97)%720)-360;
  if(Math.abs(x)<90||Math.abs(z)<90)continue;
  addHouse(x,z);
}

for(let i=0;i<75;i++){
  const x=((i*131)%1100)-550,z=((i*211)%800)-400;
  if(Math.abs(x)<80||Math.abs(z)<75)continue;
  const trunk=cyl(1.7,8,0x66442a);trunk.position.set(x,4,z);scene.add(trunk);
  const crown=cyl(6,9,0x2f6b35);crown.position.set(x,11,z);scene.add(crown);
}

function makePlayerMesh(p,mine){
  const g=new THREE.Group();
  const body=cyl(2.5,7,mine?0x167fe0:0xd64a3c);body.position.y=4.5;g.add(body);
  const head=new THREE.Mesh(new THREE.SphereGeometry(2.2,12,8),mat(0xd7a77a));head.position.y=9.5;g.add(head);
  const gun=box(1.1,1.1,7,0x262626);gun.position.set(0,6,-4.5);g.add(gun);
  scene.add(g);return g;
}

function syncMeshes(){
  const active=new Set(Object.keys(state.players));
  for(const [id,m] of meshes){
    if(!active.has(id)){scene.remove(m);meshes.delete(id)}
  }
  for(const id in state.players){
    const p=state.players[id];
    if(!p.alive)continue;
    let m=meshes.get(id);
    if(!m){m=makePlayerMesh(p,id===myId);meshes.set(id,m)}
    m.position.set(p.x,p.y||0,p.z);
    const a=Math.atan2(p.ax||0,p.az||-1);m.rotation.y=a;
  }
}

function sendInput(){
  if(!socket||!joined)return;
  let dx=joy.x+(keys.a||keys.ArrowLeft?-1:0)+(keys.d||keys.ArrowRight?1:0);
  let dz=joy.y+(keys.w||keys.ArrowUp?-1:0)+(keys.s||keys.ArrowDown?1:0);
  const n=Math.hypot(dx,dz);if(n>1){dx/=n;dz/=n}
  socket.emit("input",{dx,dz,ax:aimDir.x,az:aimDir.z,shoot});
}

function updateCamera(){
  const p=state.players[myId];if(!p)return;
  me=p;
  const yaw=Math.atan2(aimDir.x,aimDir.z);
  const distance=aiming?13:18;
  const target=new THREE.Vector3(p.x,5,p.z);
  const desired=new THREE.Vector3(
    p.x-Math.sin(yaw)*distance,
    10,
    p.z-Math.cos(yaw)*distance
  );
  camera.position.lerp(desired,.16);
  camera.lookAt(target);
  document.getElementById("name").textContent=p.name||"Player";
  document.getElementById("hp").textContent=Math.max(0,Math.ceil(p.hp));
  document.getElementById("ammo").textContent=p.ammo;
  document.getElementById("kills").textContent=p.kills;
  document.getElementById("alive").textContent=Object.values(state.players).filter(x=>x.alive).length;
  document.getElementById("zone").textContent="ZONE: "+Math.round(state.safe.r)+"m";
}

function aimAt(x,y){
  const p=state.players[myId];if(!p)return;
  const ray=new THREE.Raycaster();
  const ndc=new THREE.Vector2(x/innerWidth*2-1,-(y/innerHeight)*2+1);
  ray.setFromCamera(ndc,camera);
  const groundPlane=new THREE.Plane(new THREE.Vector3(0,1,0),0);
  const hit=new THREE.Vector3();
  if(ray.ray.intersectPlane(groundPlane,hit)){
    const dx=hit.x-p.x,dz=hit.z-p.z,n=Math.hypot(dx,dz)||1;
    aimDir.x=dx/n;aimDir.z=dz/n;
  }
}

function connect(){
  if(SERVER_URL.includes("YOUR_RENDER")){
    document.getElementById("status").textContent="Set your Render server URL in index.html";
    return;
  }
  socket=io(SERVER_URL,{transports:["websocket","polling"]});
  socket.on("connect",()=>document.getElementById("status").textContent="Connected — join the battle");
  socket.on("connect_error",()=>document.getElementById("status").textContent="Server unavailable");
  socket.on("welcome",d=>{myId=d.id});
  socket.on("joined",()=>{joined=true;document.getElementById("start").classList.add("hidden")});
  socket.on("state",s=>{state=s;syncMeshes();updateCamera()});
  socket.on("gameover",d=>{
    document.getElementById("end").classList.remove("hidden");
    document.getElementById("result").textContent=d.win?"🏆 BOOYAH!":"💀 ELIMINATED";
    document.getElementById("resultText").textContent=d.text||"Battle ended";
  });
}
connect();

document.getElementById("join").addEventListener("click",()=>{
  if(!socket||!socket.connected)return;
  const name=(document.getElementById("playerName").value.trim()||"Desi Player").slice(0,16);
  socket.emit("join",{name});
});

addEventListener("keydown",e=>{
  keys[e.key]=true;
  if(e.code==="Space"){shoot=true;e.preventDefault()}
  if(e.key.toLowerCase()==="r"&&socket)socket.emit("reload");
});
addEventListener("keyup",e=>{keys[e.key]=false;if(e.code==="Space")shoot=false});

canvas.addEventListener("pointerdown",e=>{if(joined){aimAt(e.clientX,e.clientY);shoot=true}});
canvas.addEventListener("pointermove",e=>{if(joined&&e.buttons)aimAt(e.clientX,e.clientY)});
canvas.addEventListener("pointerup",()=>shoot=false);

document.getElementById("fire").addEventListener("pointerdown",()=>shoot=true);
document.getElementById("fire").addEventListener("pointerup",()=>shoot=false);
document.getElementById("fire").addEventListener("pointercancel",()=>shoot=false);
document.getElementById("aim").addEventListener("pointerdown",()=>aiming=true);
document.getElementById("aim").addEventListener("pointerup",()=>aiming=false);
document.getElementById("med").addEventListener("pointerdown",()=>socket&&socket.emit("heal"));
document.getElementById("reload").addEventListener("pointerdown",()=>socket&&socket.emit("reload"));

const joyEl=document.getElementById("joy"),stickEl=document.getElementById("stick");
function moveJoy(e){
  const r=joyEl.getBoundingClientRect(),cx=r.left+r.width/2,cy=r.top+r.height/2,max=45;
  let x=e.clientX-cx,y=e.clientY-cy,n=Math.hypot(x,y)||1;
  if(n>max){x=x/n*max;y=y/n*max}
  joy.x=x/max;joy.y=y/max;stickEl.style.transform=`translate(${x}px,${y}px)`;
}
function resetJoy(){joyOn=false;joy.x=0;joy.y=0;stickEl.style.transform="translate(0,0)"}
joyEl.addEventListener("pointerdown",e=>{joyOn=true;joyEl.setPointerCapture(e.pointerId);moveJoy(e)});
joyEl.addEventListener("pointermove",e=>{if(joyOn)moveJoy(e)});
joyEl.addEventListener("pointerup",resetJoy);joyEl.addEventListener("pointercancel",resetJoy);

function animate(t){
  const dt=Math.min(.05,(t-last)/1000||0);last=t;
  if(joined)sendInput();
  renderer.render(scene,camera);
  requestAnimationFrame(animate);
}
requestAnimationFrame(animate);

addEventListener("resize",()=>{
  camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();
  renderer.setSize(innerWidth,innerHeight);
});
</script>
</body>
</html>
